name: CI

# O pipeline vive em github.com/rigst/ci. Ajuste lá vale para todos os projetos.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    # Fixado no SHA, e não na tag v1: tag é ponteiro móvel, e quem puder
    # reescrevê-la passa a rodar código arbitrário com os secrets deste repo.
    # O comentário ao lado é o que o Dependabot lê para propor a subida — as
    # melhorias do pipeline compartilhado continuam chegando, só que como PR
    # revisável em vez de silenciosamente. Ver .github/dependabot.yml.
    uses: rigst/ci/.github/workflows/python-django.yml@95d07687022dc719e0dd4391f04fbdbebf0100e1 # v1
    # Explícito em vez de `secrets: inherit`: o workflow chamado recebe só
    # estes dois, e não tudo que o repositório tiver hoje ou vier a ter.
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    with:
      python-version: "3.12"
      django-settings-module: config.settings

      # WARNING (o padrão) reprovaria em security.W005 e security.W021, que aqui
      # são escolha deliberada: o .env.production.example define
      # DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS e DJANGO_SECURE_HSTS_PRELOAD como
      # false. Preencher essas variáveis com `true` só no CI daria um verde
      # falso, então o que muda é o nível de falha. Revertendo para WARNING no
      # dia em que o HSTS for endurecido em produção.
      django-check-fail-level: ERROR
      source-paths: >-
        agenda arquivos briefing config contratos core crm diagnostico fases
        financeiro fornecedores jornada legal modelos notificacoes obras
        orcamentos precificacao projetos propostas regulatorio tarefas usuarios

      # Valores fictícios, só para os settings carregarem no CI.
      # Nenhum segredo real entra aqui — os de verdade ficam em Secrets.
      django-env: |
        DJANGO_ENV=production
        DJANGO_SECRET_KEY=ci-only-0a1B2c3D4e5F6g7H8i9J-kLmNoPqRsTuVwXyZ-abcdefghij
        DJANGO_ALLOWED_HOSTS=example.com
        # Os settings recusam origem não-HTTPS quando DJANGO_ENV=production.
        DJANGO_CSRF_TRUSTED_ORIGINS=https://example.com
        DATABASE_URL=postgres://postgres:postgres@localhost:5432/postgres
        DJANGO_REDIS_CACHE_URL=redis://localhost:6379/1
        CELERY_BROKER_URL=redis://localhost:6379/2
        CELERY_RESULT_BACKEND=redis://localhost:6379/2
        DJANGO_STATIC_ROOT=/tmp/static
        DJANGO_MEDIA_ROOT=/tmp/media

      # Só no job de testes: em production os settings exigem TLS no banco
      # (DJANGO_DB_SSL_REQUIRE herda IS_PRODUCTION) e o Postgres do runner não
      # tem TLS. Os testes seguem no Postgres, igual à produção, só sem SSL.
      # Esvaziar as URLs do Redis não é gambiarra: os settings já caem em
      # LocMemCache e Celery eager quando elas faltam, que é como o projeto roda
      # em desenvolvimento. Evita subir um Redis só para o CI.
      # CONN_MAX_AGE=0 é o default do Django e evita conexão persistente entre
      # testes.
      # ALLOWED_HOSTS: o django-env usa example.com porque o check --deploy
      # recusa curinga; os testes batem em localhost e levavam 400 em toda view.
      test-env: |
        DJANGO_ENV=development
        DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,testserver
        DJANGO_DB_SSL_REQUIRE=false
        DJANGO_DB_CONN_MAX_AGE=0
        DJANGO_REDIS_CACHE_URL=
        CELERY_BROKER_URL=
        CELERY_RESULT_BACKEND=

      # Piso de cobertura. Fica um pouco abaixo do valor medido de propósito:
      # o objetivo é impedir queda, não travar o build em variação de arredonda-
      # mento. Suba junto com a cobertura real.
      coverage-fail-under: 80

      # Nada em soft-fail: toda etapa bloqueia. O mypy foi o último a sair,
      # depois que o plugin do django-stubs entrou no pipeline compartilhado e
      # os 64 erros restantes foram resolvidos um a um.
      soft-fail: ""

      # Desligado nas PRs do Dependabot. O GitHub não entrega os secrets do
      # Actions a esse ator — usa um cofre separado, justamente para que uma
      # dependência comprometida não alcance credencial de projeto. Sem o
      # SONAR_TOKEN o scanner falha com "Not authorized", e como o job `CI` é
      # obrigatório no branch protection, nenhuma atualização de dependência
      # conseguia entrar. As outras etapas continuam rodando: são elas que
      # dizem se a nova versão quebra o projeto.
      run-sonar: ${{ github.actor != 'dependabot[bot]' }}
      sonar-project-key: rigst_sistema_arq
      sonar-organization: rigst
      # Sem isto o job do Sonar termina verde assim que envia a análise, e o
      # Quality Gate reprovando não aparece no CI — que era o caso aqui: build
      # verde com o gate vermelho por cobertura e nota de segurança. Com `wait`,
      # o scanner aguarda o veredito e falha junto.
      # A lista de coverage.exclusions repete a do pipeline compartilhado
      # porque propriedade repetida no scanner é substituída, não somada: sem
      # copiar o resto, migrações e testes voltariam a contar. O que muda é o
      # acréscimo de scripts/**, ferramenta de desenvolvimento que o
      # .coveragerc já omite — sem isso o gerador do lock derrubava a cobertura
      # de código novo para 6,8%.
      sonar-args: >-
        -Dsonar.qualitygate.wait=true
        -Dsonar.coverage.exclusions=**/migrations/**,**/tests.py,**/tests_*.py,**/test_*.py,**/tests/**,**/conftest.py,**/settings/**,**/manage.py,**/wsgi.py,**/asgi.py,scripts/**

  # Job próprio, e não etapa do pipeline compartilhado: o lock é uma escolha
  # deste repositório, não dos sete. Roda em segundos e sem rede.
  lock:
    name: lock em dia
    runs-on: ubuntu-latest
    steps:
      # Fixadas em SHA pelo mesmo motivo do pipeline acima.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: requirements.lock confere com requirements.txt
        run: python scripts/conferir_lock.py
