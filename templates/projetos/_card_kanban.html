<article class="kanban-card" draggable="true" data-pk="{{ p.pk }}">
    <a class="kanban-card-nome" href="{% url 'projeto_detalhe' p.pk %}">{{ p.nome }}</a>
    <p class="kanban-card-cli">{{ p.cliente.nome }}</p>
    <div class="kanban-card-meta">
        <span>{{ p.fase_atual.nome|default:"—" }}</span>
        {% if p.lembretes_fixados %}<span class="tag-alerta">{{ p.lembretes_fixados }} lembrete(s)</span>{% endif %}
    </div>
</article>
