{% extends "base.html" %}
{% block title %}{{ titulo }}{% endblock %}

{% block content %}
<section class="page page--narrow">
    {% include "core/_voltar.html" with url_voltar_nome="projetos_painel" rotulo_voltar="Projetos" %}
    <header class="page-head">
        <span class="ds-kicker">Projetos</span>
        <h1 class="ds-h2 ds-display">{{ titulo }}</h1>
    </header>
    <form method="post" class="ds-card form-card">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="form-actions">
            <a class="ds-btn" href="{% url 'projetos_painel' %}">Cancelar</a>
            <button class="ds-btn ds-btn--solid" type="submit">Salvar</button>
        </div>
    </form>
</section>
{% endblock %}
