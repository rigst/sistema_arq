{% extends "base.html" %}
{% block title %}Nova proposta{% endblock %}

{% block content %}
<section class="page page--narrow">
    <header class="page-head">
        <span class="ds-kicker">Propostas</span>
        <h1 class="ds-h2 ds-display">Nova proposta</h1>
    </header>

    {% include "core/_contexto_projeto.html" %}

    <form method="post" class="ds-card form-card">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="form-actions">
            <a class="ds-btn" href="{% if projeto %}{% url 'projeto_detalhe' projeto.pk %}{% else %}{% url 'propostas_lista' %}{% endif %}">Cancelar</a>
            <button class="ds-btn ds-btn--solid" type="submit">Criar</button>
        </div>
    </form>
</section>
{% endblock %}
