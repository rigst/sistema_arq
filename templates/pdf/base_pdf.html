<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<style>
    @page {
        size: A4; margin: 3cm 1.75cm 2.1cm;
        @bottom-left { content: "A.R.Q.  ·  DOCUMENTO PROFISSIONAL"; font: 7.5px "DejaVu Sans", Arial, sans-serif; color: #63706c; letter-spacing: .11em; }
        @bottom-right { content: "PÁGINA " counter(page) " DE " counter(pages); font: 7.5px "DejaVu Sans", Arial, sans-serif; color: #39423f; letter-spacing: .08em; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "DejaVu Sans", Arial, sans-serif; color: #14181a; font-size: 10px; line-height: 1.58; }
    .doc-watermark { position: fixed; left: 25%; top: 34%; width: 50%; height: 28%; object-fit: contain; opacity: .028; z-index: -1; }
    .doc-head {
        position: fixed; top: -2.35cm; left: 0; right: 0; height: 1.55cm;
        border-bottom: 1px solid #c4ccc8; padding: 0 0 10px;
        display: flex; justify-content: space-between; align-items: center;
    }
    .doc-head::after { content: ""; position: absolute; left: 0; bottom: -2px; width: 46px; height: 3px; background: #1c6a53; }
    .doc-brand { display: flex; align-items: center; gap: 12px; }
    .doc-logo { display: block; width: auto; max-width: 132px; height: 42px; object-fit: contain; }
    .doc-emp { font-size: 14px; font-weight: 700; color: #14181a; letter-spacing: -.015em; }
    .doc-tipo { margin-top: 2px; text-transform: uppercase; letter-spacing: .13em; color: #5b6a65; font-size: 7px; font-weight: 600; }
    .doc-data { color: #5b6a65; font-size: 8px; letter-spacing: .04em; }
    h1 { max-width: 15cm; font-size: 23px; line-height: 1.12; letter-spacing: -.03em; margin: 0 0 8px; color: #14181a; }
    p { orphans: 3; widows: 3; }
    strong { color: #14181a; }
    .muted { color: #5b6a65; }
    table { width: 100%; border-collapse: collapse; margin: 18px 0 25px; page-break-inside: auto; }
    tr { page-break-inside: avoid; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid #dee3e0; vertical-align: top; }
    thead th { background: #e9edeb; color: #39423f; border-top: 1px solid #c4ccc8; border-bottom: 1px solid #c4ccc8; font-size: 7.5px; text-transform: uppercase; letter-spacing: .105em; font-weight: 700; }
    tbody tr:nth-child(even) td { background: rgba(233, 237, 235, .48); }
    tfoot th { border-top: 2px solid #1c6a53; border-bottom: 0; padding-top: 12px; font-size: 10.5px; color: #14181a; }
    .total { text-align: right; }
    .bloco { margin: 24px 0 9px; page-break-inside: avoid; }
    .bloco h3 { display: flex; align-items: center; font-size: 9px; margin: 0 0 8px; padding-bottom: 7px; color: #1c6a53; border-bottom: 1px solid #c4ccc8; text-transform: uppercase; letter-spacing: .12em; }
    .doc-meta { display: grid; grid-template-columns: 1.6fr 1fr 1fr; gap: 1px; margin: 17px 0 23px; background: #dee3e0; border-top: 1px solid #c4ccc8; border-bottom: 1px solid #c4ccc8; }
    .doc-meta > div { padding: 9px 10px; background: #f1f4f2; }
    .doc-meta span { display: block; margin-bottom: 3px; color: #63706c; font-size: 7px; font-weight: 600; text-transform: uppercase; letter-spacing: .11em; }
    .doc-meta strong { font-size: 9.5px; font-weight: 600; }
    .doc-assinatura { width: 68%; margin: 62px auto 4px; padding-top: 54px; page-break-inside: avoid; text-align: center; }
    .doc-assinatura-linha { border-top: 1px solid #39423f; padding-top: 8px; }
    .doc-assinatura strong { display: block; font-size: 10px; }
    .doc-assinatura span { display: block; margin-top: 2px; color: #63706c; font-size: 7px; text-transform: uppercase; letter-spacing: .1em; }
    ul { padding-left: 18px; }
    {% block extra_style %}{% endblock %}
</style>
</head>
<body>
    {% if empresa_logo_data_uri %}<img class="doc-watermark" src="{{ empresa_logo_data_uri }}" width="320" height="180" alt="">{% endif %}
    <header class="doc-head">
        <div class="doc-brand">
            {% if empresa_logo_data_uri %}<img class="doc-logo" src="{{ empresa_logo_data_uri }}" width="132" height="42" alt="{{ empresa_logo_alt }}">{% endif %}
            <div>
                <div class="doc-emp">{{ empresa_nome }}</div>
                <div class="doc-tipo">{% block tipo %}Documento{% endblock %}</div>
            </div>
        </div>
        <div class="doc-data">{{ hoje|date:"d/m/Y" }}</div>
    </header>
    <main>{% block conteudo %}{% endblock %}</main>
</body>
</html>
