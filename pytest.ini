[pytest]
DJANGO_SETTINGS_MODULE = config.settings

# O padrão do pytest é test_*.py. O projeto usa tests.py por app (e alguns
# test_<assunto>.py), então sem esta linha quase toda a suíte fica de fora.
python_files = tests.py tests_*.py test_*.py

norecursedirs = .git deploy static node_modules *.egg-info

addopts = --strict-markers

# Com --strict-markers ligado, marcador não declarado é erro de coleta e não
# aviso — então esta linha é obrigatória, não documentação. Os testes marcados
# `e2e` exigem Playwright e rodam só no job de mesmo nome; o job de testes
# comum os exclui com -m "not e2e".
markers =
    e2e: teste de ponta a ponta em navegador (requer pytest-playwright)
